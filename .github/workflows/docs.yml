name: Documentation

on:
  push:
    branches:
      - main
  # Reconstruction hebdomadaire (le lundi) : reprend les modules publiés depuis le dernier déploiement
  schedule:
    - cron: "17 3 * * 1"
  # Reconstruction manuelle, ou déclenchée à la publication d'une version d'un module
  workflow_dispatch:
  repository_dispatch:
    types: [module-released]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      # Récupère README, CHANGELOG et fiche de chaque module depuis son dépôt public
      - run: python scripts/collect_modules.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
